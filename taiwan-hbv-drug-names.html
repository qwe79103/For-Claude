<title>台灣B肝用藥對照表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500&family=Noto+Serif+TC:wght@600&display=swap">

<style>
  :root {
    --ground:      #F1F4F1;
    --surface:     #FFFFFF;
    --ink:         #16211E;
    --ink-2:       #3C4B45;
    --muted:       #64736C;
    --line:        #DCE3DD;
    --line-strong: #C3CFC7;
    --accent:      #1C6A4F;
    --accent-soft: #E0EDE5;
    --accent-ink:  #14503C;

    --serif: "Noto Serif TC", "PingFang TC", "Songti TC", serif;
    --sans:  "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    --mono:  "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground:      #0F1513;
      --surface:     #171F1C;
      --ink:         #E7EDE9;
      --ink-2:       #C0CCC6;
      --muted:       #93A29B;
      --line:        #27332E;
      --line-strong: #35443E;
      --accent:      #6FC49D;
      --accent-soft: #1B2E26;
      --accent-ink:  #8FD6B4;
    }
  }

  :root[data-theme="dark"] {
    --ground:      #0F1513;
    --surface:     #171F1C;
    --ink:         #E7EDE9;
    --ink-2:       #C0CCC6;
    --muted:       #93A29B;
    --line:        #27332E;
    --line-strong: #35443E;
    --accent:      #6FC49D;
    --accent-soft: #1B2E26;
    --accent-ink:  #8FD6B4;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 17px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 46rem;
    margin: 0 auto;
    padding: clamp(2.25rem, 6vw, 4.5rem) clamp(1.1rem, 4vw, 2.5rem) 4rem;
    display: flex;
    flex-direction: column;
    gap: clamp(1.75rem, 4vw, 2.5rem);
  }

  header { display: flex; flex-direction: column; gap: .8rem; }

  .eyebrow {
    font-family: var(--mono);
    font-size: .78rem;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: .7rem;
  }
  .eyebrow::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--line-strong);
  }

  h1 {
    font-family: var(--serif);
    font-weight: 600;
    font-size: clamp(1.75rem, 5vw, 2.5rem);
    line-height: 1.3;
    letter-spacing: .01em;
    margin: 0;
    text-wrap: balance;
  }

  .stamp {
    font-family: var(--mono);
    font-size: .8rem;
    color: var(--muted);
    letter-spacing: .02em;
  }

  .list {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 3px;
    display: flex;
    flex-direction: column;
  }

  .drug {
    display: grid;
    grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
    gap: .5rem 1.75rem;
    padding: 1.5rem clamp(1.1rem, 3vw, 1.75rem);
    border-top: 1px solid var(--line);
  }
  .drug:first-child { border-top: none; }

  .col-label {
    font-family: var(--mono);
    font-size: .68rem;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: .35rem;
  }

  .generic {
    font-family: var(--mono);
    font-weight: 500;
    font-size: 1.05rem;
    line-height: 1.5;
    color: var(--ink);
    word-break: break-word;
  }

  .brand-zh {
    font-family: var(--serif);
    font-weight: 600;
    font-size: 1.45rem;
    line-height: 1.4;
    letter-spacing: .05em;
    color: var(--accent);
  }

  .brand-en {
    font-family: var(--mono);
    font-size: .95rem;
    color: var(--ink-2);
  }

  .tag {
    display: inline-block;
    font-family: var(--mono);
    font-size: .68rem;
    letter-spacing: .1em;
    padding: .12rem .45rem;
    border-radius: 2px;
    vertical-align: .14em;
    margin-left: .5rem;
    background: var(--accent-soft);
    color: var(--accent-ink);
  }

  @media (max-width: 33rem) {
    body { font-size: 16px; }
    .drug { grid-template-columns: 1fr; gap: 1rem; padding-block: 1.3rem; }
  }
</style>

<div class="page">

  <header>
    <div class="eyebrow">台灣 · 慢性B型肝炎</div>
    <h1>B肝口服抗病毒藥物 中英文藥名對照</h1>
    <div class="stamp">資料整理：2026 年 8 月</div>
  </header>

  <div class="list">

    <div class="drug">
      <div>
        <div class="col-label">成分名 Generic</div>
        <div class="generic">Entecavir<span class="tag">ETV</span></div>
      </div>
      <div>
        <div class="col-label">商品名 Brand</div>
        <div class="brand-zh">貝樂克</div>
        <div class="brand-en">Baraclude</div>
      </div>
    </div>

    <div class="drug">
      <div>
        <div class="col-label">成分名 Generic</div>
        <div class="generic">Tenofovir disoproxil fumarate<span class="tag">TDF</span></div>
      </div>
      <div>
        <div class="col-label">商品名 Brand</div>
        <div class="brand-zh">惠立妥</div>
        <div class="brand-en">Viread</div>
      </div>
    </div>

    <div class="drug">
      <div>
        <div class="col-label">成分名 Generic</div>
        <div class="generic">Tenofovir alafenamide<span class="tag">TAF</span></div>
      </div>
      <div>
        <div class="col-label">商品名 Brand</div>
        <div class="brand-zh">韋立得</div>
        <div class="brand-en">Vemlidy</div>
      </div>
    </div>

  </div>

</div>
